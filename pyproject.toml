[project]
name = "xournal-menu"
version = "1.0.0"
description = "Menu simples para Xournal++ com PyQt6"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6.0",
    "pynput>=1.7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
