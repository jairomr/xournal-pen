name: Build and Release

on:
  push:
    branches:
      - main
      - develop
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          libgstreamer1.0-dev \
          libgstreamer-plugins-base1.0-dev \
          libmtdev-dev \
          libgl1-mesa-dev \
          xorg-dev \
          libx11-dev \
          libxi-dev \
          libxext-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile \
          --name xournal-radial-menu-linux \
          --windowed \
          --add-data "assets:assets" \
          src/main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: xournal-radial-menu-linux
        path: dist/xournal-radial-menu-linux

  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile `
          --name xournal-radial-menu-windows.exe `
          --windowed `
          --add-data "assets;assets" `
          src/main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: xournal-radial-menu-windows
        path: dist/xournal-radial-menu-windows.exe

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile \
          --name xournal-radial-menu-macos \
          --windowed \
          --add-data "assets:assets" \
          src/main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: xournal-radial-menu-macos
        path: dist/xournal-radial-menu-macos

  create-release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          xournal-radial-menu-linux/xournal-radial-menu-linux
          xournal-radial-menu-windows/xournal-radial-menu-windows.exe
          xournal-radial-menu-macos/xournal-radial-menu-macos
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
